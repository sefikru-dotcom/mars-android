name: CI

"on":
  push:
    branches: [main, 'run/**', 'wave/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Один job вместо трёх. Раньше wrapper-validation, android и release-signing
# шли отдельными job'ами: каждый job тарифицируется минимум как 1 минута, и
# wrapper-validation (16 с реальной работы) съедал по минуте за прогон.
# Кроме того android и release-signing собирали одни и те же release-APK
# дважды. Теперь: один раннер, один setup JDK, одна инвокация Gradle.
jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Materialize Firebase google-services.json from CI secrets
        env:
          GS_MOBILE_B64: ${{ secrets.MARS_GOOGLE_SERVICES_MOBILE_B64 }}
          GS_TV_B64: ${{ secrets.MARS_GOOGLE_SERVICES_TV_B64 }}
        run: |
          set -eu
          printf '%s' "$GS_MOBILE_B64" | base64 -d > app-mobile/google-services.json
          printf '%s' "$GS_TV_B64" | base64 -d > app-tv/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Guard — no keystores or hardcoded signing secrets in git
        run: |
          set -eu
          if git ls-files | grep -Eiq '\.(keystore|jks|p12|pfx|pem)$'; then
            echo 'FAIL: keystore/key material tracked in git'; exit 1
          fi
          if git grep -nE '(storePassword|keyPassword|storeFile)[[:space:]]*=[[:space:]]*"[^"]+"' -- '*.gradle.kts'; then
            echo 'FAIL: hardcoded signing material in gradle scripts'; exit 1
          fi

      - name: Resolve release keystore from CI secrets
        env:
          MARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.MARS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${MARS_RELEASE_KEYSTORE_BASE64:-}" ]; then
            mkdir -p build/signing
            printf '%s' "$MARS_RELEASE_KEYSTORE_BASE64" | base64 -d > build/signing/release.keystore
            echo "MARS_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/build/signing/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_EXPECTED=signed" >> "$GITHUB_ENV"
            echo 'Release keystore secret present: building SIGNED release.'
          else
            echo "SIGNING_EXPECTED=unsigned" >> "$GITHUB_ENV"
            echo 'Release keystore secret NOT configured: building UNSIGNED release (contract check only).'
          fi

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      # Одна инвокация Gradle: тесты, lint, debug-APK и release-APK собираются
      # в общем прогоне. Раньше это были четыре отдельных вызова с --no-daemon,
      # то есть четыре холодные JVM и четырёхкратная фаза конфигурации.
      # assembleDebug оставлен как гейт (debug-манифест и упаковка), но в
      # артефакты не выкладывается: см. блок upload ниже.
      - name: Build, test and lint all variants (single Gradle run)
        env:
          MARS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MARS_RELEASE_KEYSTORE_PASSWORD }}
          MARS_RELEASE_KEY_ALIAS: ${{ secrets.MARS_RELEASE_KEY_ALIAS }}
          MARS_RELEASE_KEY_PASSWORD: ${{ secrets.MARS_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            :core-network:test \
            :app-tv:testDebugUnitTest :app-mobile:testDebugUnitTest \
            :app-tv:lintRelease :app-mobile:lintRelease \
            :app-tv:assembleDebug :app-mobile:assembleDebug \
            :app-tv:assembleRelease :app-mobile:assembleRelease

      - name: Design-system parity gate (no hardcoded colors, no banned glyphs)
        run: |
          set -eu
          python3 scripts/theme-parity-audit.py app-mobile/src/main
          python3 scripts/theme-parity-audit.py app-tv/src/main

      - name: Unit tests for release-gate scripts (pure python3, no SDK)
        run: |
          python3 tests/test_apk_contract_check.py
          python3 tests/test_theme_parity_audit.py

      - name: Verify signing contract with apksigner
        run: |
          set -eu
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools -type f -name apksigner | sort -V | tail -1)"
          for m in app-mobile app-tv; do
            dir="$m/build/outputs/apk/release"
            if [ "$SIGNING_EXPECTED" = signed ]; then
              apk="$dir/$m-release.apk"
              test -f "$apk" || { echo "FAIL: no signed release APK for $m"; exit 1; }
              out="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
              echo "$out"
              echo "$out" | grep -q '^Verifies' || { echo "FAIL: $m release APK does not verify"; exit 1; }
              if echo "$out" | grep -qi 'androiddebugkey\|CN=Android Debug'; then
                echo "FAIL: $m release signed with DEBUG key — not production"; exit 1
              fi
            else
              apk="$dir/$m-release-unsigned.apk"
              test -f "$apk" || { echo "FAIL: no unsigned release APK for $m"; exit 1; }
              if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
                echo "FAIL: $m 'unsigned' APK is actually signed — signing must come only from CI secrets"; exit 1
              fi
              echo "$m: unsigned release OK (signing secrets not configured)"
            fi
          done

      # Контракт раздачи (см. mars-apk-publish.py): R8-минификация всегда;
      # схема подписи v3-only — только когда APK реально подписан.
      - name: Release APK contract (R8 minification + v3-only signing)
        run: |
          set -eu
          for m in app-mobile app-tv; do
            dir="$m/build/outputs/apk/release"
            if [ "$SIGNING_EXPECTED" = signed ]; then
              apk="$dir/$m-release.apk"
              scheme="v3-only"
            else
              apk="$dir/$m-release-unsigned.apk"
              scheme="skip"  # unsigned-ветка проходит, как раньше
            fi
            python3 scripts/apk-contract-check.py "$apk" --signing-scheme "$scheme"
          done

      - name: Generate artifact checksums
        if: always()
        run: |
          mkdir -p build/ci-artifacts
          find app-mobile/build/outputs/apk/release app-tv/build/outputs/apk/release \
            -type f -name '*.apk' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum > build/ci-artifacts/SHA256SUMS

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app-tv/build/reports/**/*.txt
            app-tv/build/reports/**/*.xml
            app-tv/build/reports/**/*.html
            app-mobile/build/reports/**/*.txt
            app-mobile/build/reports/**/*.xml
            app-mobile/build/reports/**/*.html
            core-network/build/reports/**/*.txt
            core-network/build/reports/**/*.xml
            core-network/build/reports/**/*.html
            app-tv/build/test-results/**/*.xml
            app-mobile/build/test-results/**/*.xml
            core-network/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 3

      # Единственный сборный артефакт: релизные APK, mapping и манифест.
      # Debug-APK из CI подписаны эфемерным ключом раннера, поверх рабочей
      # сборки не встают и никем не скачивались, а занимали ~1,9 ГБ общего
      # пула хранения (лимит Free — 500 МБ на artifacts + Packages).
      # Имя android-build-<sha> сохранено: на него смотрит skill ci-run-verification
      # (sha256sum -c build/ci-artifacts/SHA256SUMS после распаковки).
      - name: Upload build artifacts and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.sha }}
          path: |
            app-mobile/build/outputs/apk/release/*.apk
            app-tv/build/outputs/apk/release/*.apk
            app-mobile/build/outputs/mapping/release/mapping.txt
            app-tv/build/outputs/mapping/release/mapping.txt
            build/ci-artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
