name: CI

"on":
  push:
    branches: [main, 'run/**', 'wave/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Пин отпечатка сертификата боевого ключа Марса. Один и тот же ключ подписывает
# и mobile, и TV. Значение — SHA-256 сертификата (не ключа): оно публично, не
# секрет, и однозначно отличает наш ключ от любого чужого debug-ключа.
#
# Почему пин, а не текст DN: боевой ключ Марса — это debug-сертификат Android
# (DN `C=US, O=Android, CN=Android Debug`), поэтому проверка «в сертификате нет
# androiddebugkey» валила каждый боевой релиз и выпуск ушёл на ручную публикацию
# с хоста. Ключ НЕ перегенерировать: смена ключа ломает обновление поверх
# установленного приложения.
env:
  MARS_EXPECTED_CERT_SHA256: 15da3b0219edc2b82a7ae20c73b18497d9034e4c745d842390451b0cb7f3d311
  MARS_PUBLISH_USER: root
  MARS_PUBLISH_HOST: marscore.ru
  MARS_PUBLISH_DIR: /opt/hermes-webui/static/apk

# Один job вместо трёх. Раньше wrapper-validation, android и release-signing
# шли отдельными job'ами: каждый job тарифицируется минимум как 1 минута, и
# wrapper-validation (16 с реальной работы) съедал по минуте за прогон.
# Кроме того android и release-signing собирали одни и те же release-APK
# дважды. Теперь: один раннер, один setup JDK, одна инвокация Gradle.
jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Materialize Firebase google-services.json from CI secrets
        env:
          GS_MOBILE_B64: ${{ secrets.MARS_GOOGLE_SERVICES_MOBILE_B64 }}
          GS_TV_B64: ${{ secrets.MARS_GOOGLE_SERVICES_TV_B64 }}
        run: |
          set -eu
          printf '%s' "$GS_MOBILE_B64" | base64 -d > app-mobile/google-services.json
          printf '%s' "$GS_TV_B64" | base64 -d > app-tv/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Guard — no keystores or hardcoded signing secrets in git
        run: |
          set -eu
          if git ls-files | grep -Eiq '\.(keystore|jks|p12|pfx|pem)$'; then
            echo 'FAIL: keystore/key material tracked in git'; exit 1
          fi
          if git grep -nE '(storePassword|keyPassword|storeFile)[[:space:]]*=[[:space:]]*"[^"]+"' -- '*.gradle.kts'; then
            echo 'FAIL: hardcoded signing material in gradle scripts'; exit 1
          fi

      - name: Resolve release keystore from CI secrets
        env:
          MARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.MARS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${MARS_RELEASE_KEYSTORE_BASE64:-}" ]; then
            mkdir -p build/signing
            printf '%s' "$MARS_RELEASE_KEYSTORE_BASE64" | base64 -d > build/signing/release.keystore
            echo "MARS_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/build/signing/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_EXPECTED=signed" >> "$GITHUB_ENV"
            echo 'Release keystore secret present: building SIGNED release.'
          else
            echo "SIGNING_EXPECTED=unsigned" >> "$GITHUB_ENV"
            echo 'Release keystore secret NOT configured: building UNSIGNED release (contract check only).'
          fi

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      # Одна инвокация Gradle: тесты, lint, debug-APK и release-APK собираются
      # в общем прогоне. Раньше это были четыре отдельных вызова с --no-daemon,
      # то есть четыре холодные JVM и четырёхкратная фаза конфигурации.
      # assembleDebug оставлен как гейт (debug-манифест и упаковка), но в
      # артефакты не выкладывается: см. блок upload ниже.
      - name: Build, test and lint all variants (single Gradle run)
        env:
          MARS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MARS_RELEASE_KEYSTORE_PASSWORD }}
          MARS_RELEASE_KEY_ALIAS: ${{ secrets.MARS_RELEASE_KEY_ALIAS }}
          MARS_RELEASE_KEY_PASSWORD: ${{ secrets.MARS_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            :core-network:test \
            :app-tv:testDebugUnitTest :app-mobile:testDebugUnitTest \
            :app-tv:lintRelease :app-mobile:lintRelease \
            :app-tv:assembleDebug :app-mobile:assembleDebug \
            :app-tv:assembleRelease :app-mobile:assembleRelease

      - name: Design-system parity gate (no hardcoded colors, no banned glyphs)
        run: |
          set -eu
          python3 scripts/theme-parity-audit.py app-mobile/src/main
          python3 scripts/theme-parity-audit.py app-tv/src/main
          # Один бренд — один hex: одноимённые токены mobile и TV обязаны
          # совпадать (до этого гейта user_border/bot_border разъехались).
          python3 scripts/theme-parity-audit.py --parity

      - name: Unit tests for release-gate scripts (pure python3, no SDK)
        run: |
          python3 tests/test_apk_contract_check.py
          python3 tests/test_theme_parity_audit.py

      - name: Verify signing contract with apksigner
        run: |
          set -eu
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools -type f -name apksigner | sort -V | tail -1)"
          export APKSIGNER
          for m in app-mobile app-tv; do
            dir="$m/build/outputs/apk/release"
            if [ "$SIGNING_EXPECTED" = signed ]; then
              apk="$dir/$m-release.apk"
              test -f "$apk" || { echo "FAIL: no signed release APK for $m"; exit 1; }
              out="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
              echo "$out"
              echo "$out" | grep -q '^Verifies' || { echo "FAIL: $m release APK does not verify"; exit 1; }
              # Подпись проверяется ПИНОМ отпечатка сертификата, а не текстом DN:
              # боевой ключ Марса сам является debug-сертификатом Android
              # (C=US, O=Android, CN=Android Debug), поэтому старая текстовая
              # проверка валила каждый боевой релиз. Если MARS_EXPECTED_CERT_SHA256
              # не задан, скрипт откатывается на старое поведение (запрет
              # debug-ключа по DN) — обратная совместимость.
              python3 scripts/apk-cert-pin-check.py "$apk" --apksigner "$APKSIGNER"
            else
              apk="$dir/$m-release-unsigned.apk"
              test -f "$apk" || { echo "FAIL: no unsigned release APK for $m"; exit 1; }
              if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
                echo "FAIL: $m 'unsigned' APK is actually signed — signing must come only from CI secrets"; exit 1
              fi
              echo "$m: unsigned release OK (signing secrets not configured)"
              if [ -n "${MARS_EXPECTED_CERT_SHA256:-}" ]; then
                echo "::warning title=cert pin skipped::$m release is unsigned (no keystore secrets) — MARS_EXPECTED_CERT_SHA256 was not verified for this build"
              fi
            fi
          done

      # Контракт раздачи (см. mars-apk-publish.py): R8-минификация всегда;
      # схема подписи v3-only — только когда APK реально подписан.
      - name: Release APK contract (R8 minification + v3-only signing)
        run: |
          set -eu
          for m in app-mobile app-tv; do
            dir="$m/build/outputs/apk/release"
            if [ "$SIGNING_EXPECTED" = signed ]; then
              apk="$dir/$m-release.apk"
              scheme="v3-only"
            else
              apk="$dir/$m-release-unsigned.apk"
              scheme="skip"  # unsigned-ветка проходит, как раньше
            fi
            python3 scripts/apk-contract-check.py "$apk" --signing-scheme "$scheme"
          done

      - name: Generate artifact checksums
        if: always()
        run: |
          mkdir -p build/ci-artifacts
          find app-mobile/build/outputs/apk/release app-tv/build/outputs/apk/release \
            -type f -name '*.apk' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum > build/ci-artifacts/SHA256SUMS

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app-tv/build/reports/**/*.txt
            app-tv/build/reports/**/*.xml
            app-tv/build/reports/**/*.html
            app-mobile/build/reports/**/*.txt
            app-mobile/build/reports/**/*.xml
            app-mobile/build/reports/**/*.html
            core-network/build/reports/**/*.txt
            core-network/build/reports/**/*.xml
            core-network/build/reports/**/*.html
            app-tv/build/test-results/**/*.xml
            app-mobile/build/test-results/**/*.xml
            core-network/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 3

      # Единственный сборный артефакт: релизные APK, mapping и манифест.
      # Debug-APK из CI подписаны эфемерным ключом раннера, поверх рабочей
      # сборки не встают и никем не скачивались, а занимали ~1,9 ГБ общего
      # пула хранения (лимит Free — 500 МБ на artifacts + Packages).
      # Имя android-build-<sha> сохранено: на него смотрит skill ci-run-verification
      # (sha256sum -c build/ci-artifacts/SHA256SUMS после распаковки).
      - name: Upload build artifacts and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.sha }}
          path: |
            app-mobile/build/outputs/apk/release/*.apk
            app-tv/build/outputs/apk/release/*.apk
            app-mobile/build/outputs/mapping/release/mapping.txt
            app-tv/build/outputs/mapping/release/mapping.txt
            build/ci-artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

  # Публикация боевого релиза ИЗ CI (раньше выпуск делали руками с хоста).
  # Условия запуска жёсткие: только push в main и только при зелёном android.
  # Ветки run/** и wave/** собираются, но НЕ публикуются.
  release-publish:
    name: Publish release APKs
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Публикация настоящая только на main; на остальных событиях — план (--dry-run).
      PUBLISH_DRY_RUN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4

      # Секрет не печатается: проверяется только факт его наличия. Без секрета
      # job не падает (иначе любой форк/новичок ломает main), а печатает
      # «publish skipped» и выходит с кодом 0.
      - name: Check publish prerequisites
        id: prereq
        env:
          MARS_PUBLISH_SSH_KEY: ${{ secrets.MARS_PUBLISH_SSH_KEY }}
        run: |
          set -eu
          if [ -z "${MARS_PUBLISH_SSH_KEY:-}" ]; then
            echo "publish skipped: secret MARS_PUBLISH_SSH_KEY is not configured"
            echo "publish skipped: секрет MARS_PUBLISH_SSH_KEY не задан — релиз собран, но не опубликован" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish enabled (dry-run=${PUBLISH_DRY_RUN})"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install publish SSH key
        if: steps.prereq.outputs.enabled == 'true'
        env:
          MARS_PUBLISH_SSH_KEY: ${{ secrets.MARS_PUBLISH_SSH_KEY }}
          MARS_PUBLISH_SSH_KEY_FILE: ${{ runner.temp }}/mars_publish_key
        run: |
          set -eu
          install -m 700 -d "$(dirname "$MARS_PUBLISH_SSH_KEY_FILE")"
          key="${MARS_PUBLISH_SSH_KEY%$'\n'}"
          printf '%s\n' "$key" > "$MARS_PUBLISH_SSH_KEY_FILE"
          chmod 600 "$MARS_PUBLISH_SSH_KEY_FILE"
          # Проверяем, что ключ парсится, не печатая его (публичная часть -> /dev/null).
          ssh-keygen -y -f "$MARS_PUBLISH_SSH_KEY_FILE" > /dev/null \
            || { echo "FAIL: MARS_PUBLISH_SSH_KEY не читается как приватный SSH-ключ"; exit 1; }
          echo "publish key installed (содержимое не выводится)"

      - name: Download release APK artifacts
        if: steps.prereq.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-build-${{ github.sha }}
          path: ci-apk

      # Перепроверка СКАЧАННОГО артефакта, а не только собранного в этом же
      # workspace: публикуется ровно то, что прошло контракт (R8 + v3-only +
      # пин отпечатка сертификата).
      - name: Re-verify downloaded release APKs
        if: steps.prereq.outputs.enabled == 'true'
        run: |
          set -eu
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then APKSIGNER="$(command -v apksigner || true)"; fi
          test -n "$APKSIGNER" || { echo "FAIL: apksigner не найден в раннере"; exit 1; }
          for m in app-mobile app-tv; do
            apk="ci-apk/$m/build/outputs/apk/release/$m-release.apk"
            test -f "$apk" || { echo "FAIL: в артефактах нет $apk"; exit 1; }
            python3 scripts/apk-contract-check.py "$apk" --signing-scheme v3-only --apksigner "$APKSIGNER"
            python3 scripts/apk-cert-pin-check.py "$apk" --apksigner "$APKSIGNER"
          done

      - name: Publish APKs to distribution host
        if: steps.prereq.outputs.enabled == 'true'
        env:
          MARS_PUBLISH_SSH_KEY_FILE: ${{ runner.temp }}/mars_publish_key
        run: |
          set -eu
          extra=()
          if [ "$PUBLISH_DRY_RUN" = "true" ]; then extra+=(--dry-run); fi
          for pair in app-mobile:mars-mobile.apk app-tv:mars-tv.apk; do
            m="${pair%%:*}"; name="${pair##*:}"
            apk="ci-apk/$m/build/outputs/apk/release/$m-release.apk"
            echo "--- $m -> $name"
            python3 scripts/apk-publish-ci.py \
              --apk "$apk" \
              --name "$name" \
              --remote-user "$MARS_PUBLISH_USER" \
              --remote-host "$MARS_PUBLISH_HOST" \
              --remote-dir "$MARS_PUBLISH_DIR" \
              --ssh-key "$MARS_PUBLISH_SSH_KEY_FILE" \
              ${extra[@]+"${extra[@]}"}
          done

      - name: Publish summary
        if: always()
        run: |
          set -eu
          if [ "${{ steps.prereq.outputs.enabled }}" != "true" ]; then
            echo "publish skipped (нет секрета MARS_PUBLISH_SSH_KEY)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH_DRY_RUN" = "true" ]; then
            echo "publish dry-run: план проверен, раздача не изменялась" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish: см. шаг «Publish APKs to distribution host»" >> "$GITHUB_STEP_SUMMARY"
          fi
